<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>趣味幸運轉盤</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background-color: #f7f9fb;
            margin-top: 30px;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #555;
        }
        .container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px auto;
        }
        /* 指針 (固定在上方) */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e74c3c;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.15));
        }
        /* 轉盤本體 - 1 秒動畫 */
        canvas {
            border-radius: 50%;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            transition: transform 1s cubic-bezier(0.15, 0.85, 0.15, 1);
        }
        button.spin-btn {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
            transition: background 0.2s;
        }
        button.spin-btn:hover {
            background-color: #43a047;
        }
        button.spin-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 彈跳視窗（Modal）樣式 */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 100; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.4); 
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 35px 50px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: scale(0.7);
            animation: popupAnim 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popupAnim {
            to { transform: scale(1); }
        }
        .modal-content h2 {
            color: #e74c3c;
            margin-top: 0;
            font-size: 26px;
        }
        .modal-content p {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
        }
        .close-btn {
            padding: 10px 25px;
            font-size: 16px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(255, 152, 0, 0.3);
        }
        .close-btn:hover {
            background-color: #f57c00;
        }
    </style>
</head>
<body>

    <h1>🎉 幸運大抽獎 🎉</h1>
    <p>獎品：十色筆、卡通膠擦、立體迷宮、小筆記本、貼紙</p>
    
    <div class="container">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
    </div>
    
    <button id="spinBtn" class="spin-btn" onclick="spinWheel()">開始轉動！</button>

    <!-- 中獎彈跳視窗 -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2>🎊 中獎通知 🎊</h2>
            <p id="modalText"></p>
            <button class="close-btn" onclick="closeModal()">太棒了！</button>
        </div>
    </div>

    <script>
        /* 
          ========================================
          🎁 獎品、柔和馬卡龍配色與權重設定區
          ========================================
        */
        const prizesConfig = [
            { name: "十色筆",   color: "#FF8B8B", weight: 3 }, // 柔和珊瑚紅
            { name: "卡通膠擦", color: "#6BE7DC", weight: 1 }, // 粉嫩薄荷綠
            { name: "立體迷宮", color: "#FFE57F", weight: 1 }, // 暖心鵝黃
            { name: "小筆記本", color: "#85E3B8", weight: 2 }, // 清新酪梨綠
            { name: "貼紙",     color: "#78C1F3", weight: 3 },  // 天空粉藍
            { name: "刮刮畫簿",  color: "#FFDAC1", weight: 1 }
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const totalSlices = prizesConfig.length;
        const arcSize = 360 / totalSlices;
        
        let currentRotation = 0;

        // 繪製轉盤
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const center = canvas.width / 2;
            const radius = center;

            for (let i = 0; i < totalSlices; i++) {
                const startAngle = (i * arcSize - 90) * Math.PI / 180;
                const endAngle = ((i + 1) * arcSize - 90) * Math.PI / 180;
                
                // 繪製扇形
                ctx.beginPath();
                ctx.fillStyle = prizesConfig[i].color;
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, startAngle, endAngle);
                ctx.lineTo(center, center);
                ctx.fill();
                
                // 加上淡淡的扇形邊線增加立體感
                ctx.lineWidth = 1;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                // 繪製文字
                ctx.save();
                ctx.translate(center, center);
                const textAngle = ((i + 0.5) * arcSize - 90) * Math.PI / 180;
                ctx.rotate(textAngle);
                ctx.textAlign = "right";
                ctx.fillStyle = "#2c3e50"; // 文字改用深色，在馬卡龍淺色背景上更清晰
                ctx.font = "bold 14px 'Segoe UI', Arial";
                ctx.fillText(prizesConfig[i].name, radius - 15, 5);
                ctx.restore();
            }
        }

        drawWheel();

        // 播放歡慶短音效 (Web Audio API)
        function playWinSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.1 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + index * 0.1);
                    osc.stop(audioCtx.currentTime + index * 0.1 + 0.3);
                });
            } catch(e) {
                console.log("Audio not supported or blocked", e);
            }
        }

        // 權重隨機抽樣演算法
        function getRandomIndexByWeight() {
            const totalWeight = prizesConfig.reduce((sum, item) => sum + item.weight, 0);
            let randomNum = Math.random() * totalWeight;
            
            for (let i = 0; i < prizesConfig.length; i++) {
                if (randomNum < prizesConfig[i].weight) {
                    return i;
                }
                randomNum -= prizesConfig[i].weight;
            }
            return 0;
        }

        function spinWheel() {
            const btn = document.getElementById("spinBtn");
            btn.disabled = true;

            const winningIndex = getRandomIndexByWeight();
            
            const prizeCenterAngle = winningIndex * arcSize + arcSize / 2;
            const extraSpins = 360 * 3;
            const targetRotation = extraSpins + (360 - prizeCenterAngle);
            
            const normalizedCurrent = currentRotation % 360;
            const diff = targetRotation - normalizedCurrent;
            currentRotation += (diff > 0 ? diff : diff + 360) + (360 * 2);

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                btn.disabled = false;
                playWinSound();
                
                document.getElementById("modalText").innerText = `恭喜獲得：${prizesConfig[winningIndex].name}！`;
                document.getElementById("resultModal").style.display = "flex";
            }, 1000);
        }

        function closeModal() {
            document.getElementById("resultModal").style.display = "none";
        }
    </script>

</body>
</html>
